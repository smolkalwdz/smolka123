<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Канбан-доска броней</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .cell {
      background: #fff;
      border: 2px solid #ccc;
      border-radius: 6px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cell-header, .cell-footer {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 6px 0;
      flex-shrink: 0;
    }
    .cell-body {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }
    .card {
      background: #ffeeba;
      border-left: 6px solid #d39e00;
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
      cursor: move;
    }
    .controls {
      margin-bottom: 20px;
    }
    .controls input,
    .controls select,
    .controls button {
      padding: 6px;
      margin-right: 6px;
    }
  </style>
</head>
<body>

<div class="controls">
  <input id="name" placeholder="Имя">
  <input id="phone" placeholder="Телефон">
  <select id="table">
    <option disabled selected>Стол</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
  </select>
  <input id="time" type="time">
  <input id="guests" type="number" placeholder="Гостей">
  <button onclick="addCard()">Добавить</button>
</div>

<div class="board">
  <div class="cell" id="table-1" ondrop="drop(event)" ondragover="allowDrop(event)">
    <div class="cell-header">Стол 1</div>
    <div class="cell-body"></div>
    <div class="cell-footer">4 – 6 чел.</div>
  </div>
  <div class="cell" id="table-2" ondrop="drop(event)" ondragover="allowDrop(event)">
    <div class="cell-header">Стол 2</div>
    <div class="cell-body"></div>
    <div class="cell-footer">4 – 6 чел.</div>
  </div>
  <div class="cell" id="table-3" ondrop="drop(event)" ondragover="allowDrop(event)">
    <div class="cell-header">Стол 3</div>
    <div class="cell-body"></div>
    <div class="cell-footer">4 – 6 чел.</div>
  </div>
</div>

<script>
  let cardId = 0;
  function allowDrop(ev) {
    ev.preventDefault();
  }
  function drag(ev) {
    ev.dataTransfer.setData("text", ev.target.id);
  }
  function drop(ev) {
    ev.preventDefault();
    const id = ev.dataTransfer.getData("text");
    ev.currentTarget.querySelector('.cell-body').appendChild(document.getElementById(id));
    saveState();
  }

  function addCard() {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const table = document.getElementById('table').value;
    const time = document.getElementById('time').value;
    const guests = document.getElementById('guests').value;
    if (!name||!phone||!table||!time||!guests) return;

    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + (cardId++);
    card.draggable = true;
    card.ondragstart = drag;
    card.innerHTML = `
      <strong>${name}</strong><br>
      ${time} • ${guests} чел.<br>
      тел. ${phone}
    `;
    document.querySelector(`#table-${table} .cell-body`).appendChild(card);
    saveState();
  }

  // --- LocalStorage ---
  function saveState() {
    const data = [];
    document.querySelectorAll('.cell').forEach(cell => {
      const table = cell.id.replace('table-','');
      cell.querySelectorAll('.card').forEach(card => {
        data.push({
          table,
          html: card.innerHTML,
          id: card.id
        });
      });
    });
    localStorage.setItem('kanbanBookings', JSON.stringify(data));
  }

  function loadState() {
    const data = JSON.parse(localStorage.getItem('kanbanBookings')||'[]');
    data.forEach(item=>{
      const cellBody = document.querySelector(`#table-${item.table} .cell-body`);
      if (!cellBody) return;
      const card = document.createElement('div');
      card.className = 'card';
      card.id = item.id;
      card.draggable = true;
      card.ondragstart = drag;
      card.innerHTML = item.html;
      cellBody.appendChild(card);
    });
  }

  window.onload = loadState;
</script>

</body>
</html>
